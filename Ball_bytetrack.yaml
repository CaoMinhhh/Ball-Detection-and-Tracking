# Custom ByteTrack Configuration for Small Fast-Moving Object (Ball) Tracking
# Note: Default ByteTrack is optimized for large objects (humans/cars). 
# These thresholds have been aggressively lowered to track small, blurred objects.

tracker_type: bytetrack

track_high_thresh: 0.05    # Minimum conf for a detection to be considered "high quality" (match/init track)
track_low_thresh: 0.01     # Lower conf threshold used only for secondary matching (ByteTrack Stage 2)
new_track_thresh: 0.05     # NEW TRACK INIT THRESHOLD: Crucial adjustment (lowered from default 0.6 to capture faint balls)
track_buffer: 60           # Lifespan (in frames) to keep a lost track alive (handles severe occlusions / motion blur)
match_thresh: 0.95         # IoU distance matching threshold
fuse_score: False          # Disabled fusing conf into IoU score to avoid penalizing low-conf true positives