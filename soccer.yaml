# YOLOv8 Dataset Configuration for Soccer Ball Detection
# Note: Ensure the dataset is extracted in the same directory as this file.

path: ./soccernet_yolo  # Relative path to the dataset root
train: images/train     # Path to training images
val: images/train       # Path to validation images (Using train set for quick evaluation)

# Classes
nc: 1                   # Number of classes
names: ['ball']         # Class labels